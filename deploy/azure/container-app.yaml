# ==============================================================================
# NetraDrishti — Azure Container Apps Declarative Template (Self-Contained Image)
#
# All 4 required model artifacts are bundled directly inside the Docker image
# under /app/models — no Azure Blob Storage or external weight downloads needed.
#
# Replace <PLACEHOLDER> values before applying with:
#   az containerapp create --resource-group <RG> --name <APP> --yaml deploy/azure/container-app.yaml
#
# Minimum-Cost Profile:
#   - Azure Container Apps Consumption: 1.0 vCPU / 2.0 GiB (peak RSS ~914 MiB),
#     minReplicas=0, maxReplicas=1 (scales to 0 when idle; uses monthly free grant)
#   - Private Registry: Docker Hub Free (1 free private repo, $0/mo) with a
#     read-only PAT secret, OR GHCR (`ghcr.io/<github-user>/netradrishti-backend`).
# ==============================================================================
properties:
  managedEnvironmentId: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.App/managedEnvironments/<CONTAINER_ENV_NAME>
  configuration:
    activeRevisionsMode: Single
    secrets:
      - name: registry-password
        value: <DOCKER_HUB_READONLY_PAT>
    ingress:
      external: true
      targetPort: 8000
      transport: auto
      allowInsecure: false
    registries:
      # Option A (Default, $0/mo): Private Docker Hub repo (1 private repo free)
      # Option B ($0/mo): Switch server to ghcr.io and image to ghcr.io/<GITHUB_USER>/netradrishti-backend:v1.0.0
      - server: index.docker.io
        username: sohamg2696
        passwordSecretRef: registry-password
  template:
    containers:
      - name: netradrishti-backend
        image: index.docker.io/sohamg2696/netradrishti-backend:v1.0.0
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: APP_ENV
            value: production
          - name: PORT
            value: "8000"
          - name: LOG_LEVEL
            value: INFO
          - name: ENABLE_DOCS
            value: "true"
          - name: NETRADRISHTI_DEVICE
            value: cpu
          - name: TORCH_NUM_THREADS
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MODEL_DIR
            value: /app/models
          - name: MAX_UPLOAD_SIZE_BYTES
            value: "10485760"
          - name: MAX_CONCURRENT_INFERENCE
            value: "4"
          - name: INFERENCE_TIMEOUT_SECONDS
            value: "60.0"
          - name: ALLOWED_ORIGINS
            value: https://<YOUR_SWA_SUBDOMAIN>.azurestaticapps.net
        probes:
          - type: Startup
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          - type: Liveness
            httpGet:
              path: /api/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          - type: Readiness
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
    scale:
      # Scale to 0 when idle ($0 compute charges while inactive; free monthly ACA grants apply).
      # Keep minReplicas=0 and maxReplicas=1 for predictable student/personal cost control.
      minReplicas: 0
      maxReplicas: 1
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "4"
